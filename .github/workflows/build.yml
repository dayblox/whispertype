name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev
      - name: Test, build and package native Windows EXE
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Test, build and package Linux
        if: runner.os == 'Linux'
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --release --locked
          python scripts/test_package.py
          python scripts/package.py --platform linux
      - name: Upload portable Windows EXE
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: whispertype-windows-x64-exe
          path: target/release/whispertype.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload installable package and checksums
        uses: actions/upload-artifact@v7
        with:
          name: whispertype-${{ runner.os }}-x64
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

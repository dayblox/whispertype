[package]
name = "whispertype"
version = "0.1.7"
edition = "2021"
license = "MIT"
description = "Quiet, native voice typing with Groq Whisper for Windows and Linux"

[dependencies]
anyhow = "1"
bytemuck = "1"
cpal = "0.16"
directories = "6"
fs2 = "0.4"
hound = "3.5"
rubato = { version = "0.16", default-features = false, features = ["fft_resampler"] }
rustpotter = { version = "3.0.2", default-features = false }
# Candle 0.2 (Rustpotter) requires the rand 0.8 implementation from half 2.3.
half = "=2.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
toml = "0.8"
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

[target.'cfg(target_os = "linux")'.dependencies]
async-io = "2"
ksni = { version = "0.3.3", default-features = false, features = ["async-io"] }
libc = "0.2"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon = "0.8"

[target.'cfg(windows)'.dependencies]
# Reuse the TLS stack's crypto implementation for streamed update verification.
ring = { version = "0.17", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Security", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_Xps", "Win32_Storage_FileSystem"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
embed-resource = "3"

[patch.crates-io]
rustpotter = { path = "vendor/rustpotter" }

[workspace]
members = ["vendor/rustpotter"]
default-members = ["."]
resolver = "2"

